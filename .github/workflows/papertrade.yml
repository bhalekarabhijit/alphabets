name: Straddle paper trading

# After NSE close (14:00 UTC = 19:30 IST), weekdays only.
# Marks open paper straddles, applies exits, opens new EDGE entries.
on:
  schedule:
    - cron: '0 14 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  papertrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server deps
        run: npm ci

      - name: Run paper trader
        run: node ../papertrade/track.mjs

      - name: Commit track record
        run: |
          cd ..
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add papertrade/paper-trades.json
          git diff --cached --quiet || git commit -m "📓 Paper trades $(date -u +%F)"
          git pull --rebase origin main
          git push
