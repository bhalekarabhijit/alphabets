name: TimesFM nightly forecasts

# After NSE close (13:30 UTC = 19:00 IST), weekdays only (Nifty 50).
# Any universe can be run on demand via "Run workflow" below.
on:
  schedule:
    - cron: '30 13 * * 1-5'
  workflow_dispatch:
    inputs:
      universe:
        description: 'Index universe to forecast'
        required: true
        default: 'nifty50'
        type: choice
        options:
          - nifty50
          - next50
          - midcap50
          - smallcap50

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: forecast/requirements.txt

      - name: Install deps (CPU-only torch to keep it light)
        run: |
          pip install 'torch>=2.0.0' --index-url https://download.pytorch.org/whl/cpu
          pip install -r forecast/requirements.txt

      - name: Run TimesFM batch forecast
        run: python forecast/forecast_nifty.py --universe "${{ inputs.universe || 'nifty50' }}"

      - name: Commit forecasts
        run: |
          git config user.name "timesfm-bot"
          git config user.email "timesfm-bot@users.noreply.github.com"
          git add forecast/forecasts-*.json forecast/picks-*.json forecast/forecasts.json forecast/picks.json
          git diff --cached --quiet || git commit -m "📈 TimesFM forecasts (${{ inputs.universe || 'nifty50' }}) $(date -u +%F)"
          git push
